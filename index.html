<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }

  #player {
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;      /* preenche a tela; use 'contain' se não quiser corte */
    background: #000;
    z-index: 1;
  }

  /* camada de texto sobre o vídeo — sem fundo, só sombra para leitura */
  #reveal {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;   /* cliques passam pro vídeo, exceto nos links */
    font-family: 'Courier New', monospace;
    color: #fff;
    text-align: center;
    padding: 40px;
    box-sizing: border-box;
  }

  #reveal .line {
    margin: 6px 0;
    font-size: 26px;
    letter-spacing: 1.5px;
    text-shadow:
      0 0 6px rgba(0,0,0,0.95),
      0 0 12px rgba(0,0,0,0.85),
      0 0 24px rgba(0,0,0,0.7);
    opacity: 0;
    transform: translateY(6px);
    animation: fadein 700ms ease forwards;
  }

  #reveal .line.small { font-size: 20px; }
  #reveal .line a {
    color: #fff;
    pointer-events: auto;
    text-decoration: underline;
  }

  @keyframes fadein {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Troque o src pelo caminho do seu vídeo.
     Local:  "video.mp4"
     Remoto: "https://seu-dominio.com/video.mp4" -->
<video id="player" src="video.mp4" controls autoplay playsinline preload="auto"></video>

<div id="reveal"></div>

<script>
  // ============================================================
  //  CONFIG
  // ============================================================
  // Email que aparece no segundo 21. Não é o email do visitante
  // (não é acessível pelo navegador). É o valor que VOCÊ define.
  const EMAIL_TO_SHOW = 'contato@exemplo.com';

  // ============================================================
  //  ESTADO — memória apenas. Nada é gravado em disco/cookie/storage.
  // ============================================================
  const video  = document.getElementById('player');
  const reveal = document.getElementById('reveal');
  const shown  = new Set();     // chaves já reveladas nesta sessão
  let   geo    = null;          // resultado da consulta de IP (só em RAM)

  // ============================================================
  //  CONSULTA DE IP — read-only. A resposta vive só na variável `geo`.
  // ============================================================
  const APIS = [
    {
      name: 'ipwho.is',
      url:  'https://ipwho.is/',
      ok:   d => d && d.success !== false,
      map:  d => ({
        ip:    d.ip,
        city:  d.city,
        region:d.region,
        lat:   d.latitude,
        lon:   d.longitude
      })
    },
    {
      name: 'ipapi.co',
      url:  'https://ipapi.co/json/',
      ok:   d => d && d.ip,
      map:  d => ({
        ip:    d.ip,
        city:  d.city,
        region:d.region,
        lat:   d.latitude,
        lon:   d.longitude
      })
    },
    {
      name: 'ipinfo.io',
      url:  'https://ipinfo.io/json',
      ok:   d => d && d.ip,
      map:  d => {
        const [lat, lon] = (d.loc || ',').split(',').map(Number);
        return { ip: d.ip, city: d.city, region: d.region, lat, lon };
      }
    },
    {
      name: 'ip-api.com',
      url:  'http://ip-api.com/json/',
      ok:   d => d && d.status === 'success',
      map:  d => ({
        ip:    d.query,
        city:  d.city,
        region:d.regionName,
        lat:   d.lat,
        lon:   d.lon
      })
    }
  ];

  async function lookup() {
    for (const api of APIS) {
      try {
        const ctrl  = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        const r = await fetch(api.url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!r.ok) continue;
        const raw = await r.json();
        if (api.ok(raw)) return api.map(raw);
      } catch (_) { /* tenta a próxima */ }
    }
    return null;
  }

  // Dispara a consulta o quanto antes, para ter o dado pronto no 18s.
  // A resposta fica só em RAM e morre quando a aba fecha.
  lookup().then(d => { geo = d || {}; });

  // ============================================================
  //  LINHAS REVELADAS — gatilho por tempo do vídeo
  // ============================================================
  const LINES = [
    {
      key: 'ip',
      at:  18,
      html: () => 'IP: ' + (geo && geo.ip || '—')
    },
    {
      key: 'city',
      at:  20,
      html: () => 'Cidade: ' + (geo && geo.city || '—') +
                 (geo && geo.region ? ' — ' + geo.region : '')
    },
    {
      key: 'email',
      at:  21,
      html: () => 'Email: ' + EMAIL_TO_SHOW
    },
    {
      key: 'time',
      at:  22,
      html: () => {
        const now = new Date();
        const hh  = String(now.getHours()).padStart(2,'0');
        const mm  = String(now.getMinutes()).padStart(2,'0');
        const ss  = String(now.getSeconds()).padStart(2,'0');
        return 'Hora local: ' + hh + ':' + mm + ':' + ss;
      }
    },
    {
      key: 'loc',
      at:  23,
      html: () => {
        if (!geo || geo.lat == null || geo.lon == null)
          return 'Localização: indisponível';
        const url = 'https://www.google.com/maps?q=' + geo.lat + ',' + geo.lon;
        return '<a href="' + url + '" target="_blank" rel="noopener">' +
               'Ver localização aproximada no Google Maps ↗</a>';
      }
    }
  ];

  function revealLine(line) {
    if (shown.has(line.key)) return;
    shown.add(line.key);

    const el = document.createElement('div');
    el.className = 'line' + (line.key === 'loc' ? ' small' : '');
    el.innerHTML = line.html();
    reveal.appendChild(el);
  }

  function checkTimeline() {
    const t = video.currentTime;
    for (const line of LINES) {
      if (!shown.has(line.key) && t >= line.at) revealLine(line);
    }
  }

  video.addEventListener('timeupdate', checkTimeline);
  video.addEventListener('seeked',     checkTimeline);

  // ============================================================
  //  GARANTIA DE NÃO-PERSISTÊNCIA
  //  Nada abaixo grava dado nenhum. Comentário só para auditoria.
  //  - Sem localStorage / sessionStorage
  //  - Sem cookies
  //  - Sem IndexedDB / Cache API
  //  - Sem POST / sendBeacon
  //  A variável `geo` vive apenas na memória desta aba e é
  //  descartada ao fechar / recarregar.
  // ============================================================
</script>

</body>
</html>
